name: CI — pruebas, calidad y seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # para publicar el SARIF de Trivy en la pestaña Security

jobs:
  pruebas:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  calidad:
    name: Análisis estático (SonarQube Cloud)
    runs-on: ubuntu-latest
    needs: pruebas
    # Análisis sin secretos (secretless): GitHub emite un token OIDC para este job y
    # SonarQube Cloud lo cambia por un token de 30 minutos limitado a este proyecto.
    # No hay ningún SONAR_TOKEN guardado en el repositorio que se pueda filtrar o rotar.
    permissions:
      contents: read
      id-token: write   # solo este job puede pedir el token OIDC
    env:
      # GitHub no entrega id-token a los pull requests que vienen de forks: ahí se omite el análisis.
      ES_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # historia completa: Sonar la usa para detectar código nuevo

      - name: Autenticar con SonarQube Cloud (OIDC, sin secretos)
        id: auth
        if: env.ES_FORK != 'true'
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2

      - name: SonarQube Scan
        if: env.ES_FORK != 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          # Organización y proyecto devueltos por el intercambio OIDC (los mismos de sonar-project.properties)
          args: >
            -Dsonar.organization=${{ steps.auth.outputs.organization }}
            -Dsonar.projectKey=${{ steps.auth.outputs.project-key }}

      - name: Aviso en pull requests desde forks
        if: env.ES_FORK == 'true'
        run: echo "::notice::PR desde un fork, sin token OIDC; el análisis de SonarQube corre al hacer merge a main"

  seguridad:
    name: Escaneo de seguridad (Trivy)
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v5

      - name: Trivy — dependencias y configuración del repositorio
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'

      - name: Construir imagen del backend
        run: docker build -t tasks-backend:${{ github.sha }} backend/

      - name: Construir imagen del frontend
        run: docker build -t tasks-frontend:${{ github.sha }} frontend/

      - name: Trivy — imagen del backend (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tasks-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-backend.sarif
          exit-code: '0'

      - name: Publicar resultados en GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-backend.sarif

      - name: Quality gate — bloquear si hay CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tasks-backend:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Quality gate — frontend, bloquear si hay CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tasks-frontend:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
